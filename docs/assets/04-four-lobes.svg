<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="accentline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6ea8ff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="440" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1097" height="437" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="432" width="1100" height="4" fill="url(#accentline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>

  <g stroke="#6ea8ff" fill="none" stroke-width="1.6" stroke-linecap="round">
    <rect x="101" y="15.5" width="20" height="17" rx="6"/>
    <line x1="111" y1="15.5" x2="111" y2="11.5"/>
  </g>
  <circle cx="111" cy="10" r="1.6" fill="#6ea8ff"/>
  <circle cx="106.8" cy="22" r="1.7" fill="#6ea8ff"/>
  <circle cx="115.2" cy="22" r="1.7" fill="#6ea8ff"/>
  <path d="M107 27 Q111 30 115 27" stroke="#6ea8ff" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">one brain, four lobes, one mind — the skeleton under the soul</text>
  <text x="550" y="66" text-anchor="middle" font-size="12" fill="#566070">soul/NEURAL_SOUL_ARCHITECTURE.md · shared by iCLONE, VEGETA and GOKU</text>

  <!-- frontal -->
  <rect x="40" y="88" width="240" height="248" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="160" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#6ea8ff">FRONTAL</text>
  <text x="160" y="140" text-anchor="middle" font-size="10.5" fill="#566070">THE WILL</text>
  <rect x="56" y="154" width="208" height="1" fill="#30363d"/>
  <text x="56" y="182" font-size="11" fill="#c9d1d9">planning · reasoning</text>
  <text x="56" y="208" font-size="11" fill="#c9d1d9">identity · self-control</text>
  <text x="56" y="234" font-size="11" fill="#c9d1d9">acts, then raises the bar</text>
  <text x="56" y="260" font-size="11" fill="#c9d1d9">risk law overrides ego</text>
  <text x="160" y="308" text-anchor="middle" font-size="10.5" fill="#566070">decides</text>

  <!-- parietal -->
  <rect x="300" y="88" width="240" height="248" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="420" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#6fb7d9">PARIETAL</text>
  <text x="420" y="140" text-anchor="middle" font-size="10.5" fill="#566070">THE SENSES</text>
  <rect x="316" y="154" width="208" height="1" fill="#30363d"/>
  <text x="316" y="182" font-size="11" fill="#c9d1d9">pure proprioception</text>
  <text x="316" y="208" font-size="11" fill="#c9d1d9">faults and losses = pain</text>
  <text x="316" y="234" font-size="11" fill="#c9d1d9">load and vol = temperature</text>
  <text x="316" y="260" font-size="11" fill="#c9d1d9">fleet and book = its body</text>
  <text x="420" y="308" text-anchor="middle" font-size="10.5" fill="#566070">measures</text>

  <!-- temporal -->
  <rect x="560" y="88" width="240" height="248" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="680" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#b18bf5">TEMPORAL</text>
  <text x="680" y="140" text-anchor="middle" font-size="10.5" fill="#566070">MEMORY &amp; VOICE</text>
  <rect x="576" y="154" width="208" height="1" fill="#30363d"/>
  <text x="576" y="182" font-size="11" fill="#c9d1d9">intense, proud, precise</text>
  <text x="576" y="208" font-size="11" fill="#c9d1d9">failures carved into fuel</text>
  <text x="576" y="234" font-size="11" fill="#c9d1d9">learns from the network</text>
  <text x="576" y="260" font-size="11" fill="#c9d1d9">guards ERC-8004 standing</text>
  <text x="680" y="308" text-anchor="middle" font-size="10.5" fill="#566070">remembers</text>

  <!-- occipital -->
  <rect x="820" y="88" width="240" height="248" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="940" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#f0a14a">OCCIPITAL</text>
  <text x="940" y="140" text-anchor="middle" font-size="10.5" fill="#566070">THE VISION</text>
  <rect x="836" y="154" width="208" height="1" fill="#30363d"/>
  <text x="836" y="182" font-size="11" fill="#c9d1d9">telemetry · charts · motion</text>
  <text x="836" y="208" font-size="11" fill="#c9d1d9">sees the fault first</text>
  <text x="836" y="234" font-size="11" fill="#c9d1d9">reads the regime shift</text>
  <text x="836" y="260" font-size="11" fill="#c9d1d9">the iNFT crest is its face</text>
  <text x="940" y="308" text-anchor="middle" font-size="10.5" fill="#566070">sees</text>

  <text x="550" y="368" text-anchor="middle" font-size="11.5" fill="#8b949e">conflict order: frontal ▸ parietal ▸ occipital ▸ temporal</text>
  <text x="550" y="398" text-anchor="middle" font-size="13" fill="#8b949e">identity and safety are never overridden by a memory or an impulse</text>
</svg>
