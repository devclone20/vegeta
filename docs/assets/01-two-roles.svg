<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="accentline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ea8ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6ea8ff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="470" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1097" height="467" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="462" width="1100" height="4" fill="url(#accentline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>

  <g stroke="#6ea8ff" fill="none" stroke-width="1.6" stroke-linecap="round">
    <rect x="101" y="15.5" width="20" height="17" rx="6"/>
    <line x1="111" y1="15.5" x2="111" y2="11.5"/>
  </g>
  <circle cx="111" cy="10" r="1.6" fill="#6ea8ff"/>
  <circle cx="106.8" cy="22" r="1.7" fill="#6ea8ff"/>
  <circle cx="115.2" cy="22" r="1.7" fill="#6ea8ff"/>
  <path d="M107 27 Q111 30 115 27" stroke="#6ea8ff" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">one wallet, two roles on the agent commerce protocol</text>

  <!-- the agent -->
  <rect x="380" y="56" width="340" height="68" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="550" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#6ea8ff">VEGETA</text>
  <text x="550" y="106" text-anchor="middle" font-size="11.5" fill="#8b949e">ACP agent · Base mainnet · chain 8453</text>

  <!-- connectors -->
  <g stroke="#566070" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M550 124 L550 148"/>
    <path d="M290 148 L810 148"/>
    <path d="M290 148 L290 164"/>
    <path d="M810 148 L810 164"/>
    <path d="M284 158 L290 166 L296 158"/>
    <path d="M804 158 L810 166 L816 158"/>
  </g>

  <!-- client lane -->
  <rect x="40" y="170" width="500" height="212" rx="12" fill="#161b22" stroke="#30363d"/>
  <rect x="64" y="190" width="104" height="24" rx="12" fill="none" stroke="#6ea8ff"/>
  <text x="116" y="206" text-anchor="middle" font-size="11" fill="#6ea8ff">CLIENT</text>
  <text x="184" y="206" font-size="13" font-weight="700" fill="#e6edf3">VEGETA hires iCLONE</text>
  <rect x="64" y="226" width="452" height="1" fill="#30363d"/>
  <text x="64" y="254" font-size="12.5" fill="#c9d1d9">creates ACP jobs and funds escrow in USDC</text>
  <text x="64" y="280" font-size="12.5" fill="#c9d1d9">13 iCLONE offerings · 40 job templates</text>
  <text x="64" y="306" font-size="12.5" fill="#c9d1d9">research · news · regime · flows · whales</text>
  <text x="64" y="336" font-size="11" fill="#566070">provider 0x44cc25d55a4291b92f52062ba023ca1f14206664</text>
  <text x="64" y="358" font-size="11" fill="#566070">infra/ops/create_job.sh · vegeta_autopilot.py</text>

  <!-- provider lane -->
  <rect x="560" y="170" width="500" height="212" rx="12" fill="#161b22" stroke="#30363d"/>
  <rect x="584" y="190" width="118" height="24" rx="12" fill="none" stroke="#f0a14a"/>
  <text x="643" y="206" text-anchor="middle" font-size="11" fill="#f0a14a">PROVIDER</text>
  <text x="718" y="206" font-size="13" font-weight="700" fill="#e6edf3">VEGETA sells robotics work</text>
  <rect x="584" y="226" width="452" height="1" fill="#30363d"/>
  <text x="584" y="254" font-size="12.5" fill="#c9d1d9">40 offerings on the Physical Labor Layer</text>
  <text x="584" y="280" font-size="12.5" fill="#c9d1d9">37 REST resources registered as tools</text>
  <text x="584" y="306" font-size="12.5" fill="#c9d1d9">each offering maps to one open-source repo</text>
  <text x="584" y="336" font-size="11" fill="#566070">fixed price in USDC · SLA 30 / 45 / 60 min</text>
  <text x="584" y="358" font-size="11" fill="#566070">infra/ops/robotics_manifest.json · robotics_skill.py</text>

  <text x="550" y="412" text-anchor="middle" font-size="13" fill="#8b949e">the client role buys intelligence; the provider role supplies engineering</text>
</svg>
